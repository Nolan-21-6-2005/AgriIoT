[theme]
base = "light"
primaryColor = "#2E7D32"
backgroundColor = "#F7F9F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
font = "sans serif"
baseFontSize = 15
baseFontWeight = 400
headingFontWeights = [700, 700, 650, 600, 600, 600]
headingFontSizes = ["2rem", "1.5rem", "1.25rem", "1.1rem", "1rem", "0.95rem"]

[client]
showErrorDetails = "type"

[server]
headless = true
